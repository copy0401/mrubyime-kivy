name: Build APK

# Builds the arm64-v8a release APK.
#
# Triggers, and where the APK ends up:
#   - push to main      -> updates the rolling "latest" GitHub Release
#   - push of a v* tag  -> a new GitHub Release named after the tag
#   - pull request      -> artifact only (a fork PR gets a read-only token, so it
#                          must never try to publish)
#   - workflow_dispatch -> artifact only
# Every run also uploads the APK as a downloadable action artifact.
#
# What CI deliberately does NOT need:
#   - python-for-android / buildozer.  app/src/main/assets/private.tar is the
#     p4a-built Python bundle and it is committed; it already holds the compiled
#     .pyc for kivy_ime/**.  Regenerating it would need host CPython 3.14 (that is
#     the .pyc magic in the bundle) plus a full p4a recipe run, which no runner
#     image provides.  Python-only edits still go through ./sync_python.sh
#     locally, which rewrites private.tar before the change is committed.
#   - local.properties.  sdk.dir is written below from the runner's SDK path.
#
# What it does need, and provisions: ruby + rake (mruby is compiled from the
# vendored source tree), NDK 30.0.x (the app pins ndkVersion 30.0.16248370) and a
# keystore -- without one Gradle emits an *unsigned* release APK.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repository default is "read" (checked: actions/permissions/workflow).
# Publishing a Release writes contents, so ask for it explicitly and nowhere
# else. Pull requests still get the fork's read-only token.
permissions:
  contents: write

env:
  # Keep in sync with mruby-ime/app/build.gradle.kts (ndkVersion, compileSdk)
  # and mruby-ime/gradle/wrapper/gradle-wrapper.properties.
  NDK_VERSION: "30.0.16248370"
  JAVA_VERSION: "17"
  # The rolling release updated by every push to main. A fixed tag keeps the
  # release list to one entry instead of one per commit.
  LATEST_TAG: "latest"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: none

      - name: Install NDK
        # The runner ships an SDK, but sdkmanager sits outside PATH
        # (cmdline-tools/<ver>/bin), so resolve the binary by glob. Not
        # android-actions/setup-android: it runs `sdkmanager --install tools`,
        # and the `tools` package no longer exists in SDK repository 2, so v3
        # aborts with "Failed to find package 'tools'".
        run: |
          set -euo pipefail
          sdk="$ANDROID_SDK_ROOT"
          sdkmanager="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | head -1)"
          test -x "$sdkmanager"
          printf 'y\n%.0s' {1..50} | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;${NDK_VERSION}" "build-tools;34.0.0" "platforms;android-34"
          ndk="$sdk/ndk/${NDK_VERSION}"
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

      - name: Point Gradle at the runner SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mruby-ime/local.properties

      - name: Install a debug keystore
        # app/build.gradle.kts only attaches the release signing config when
        # ~/.android/debug.keystore exists; otherwise the APK is unsigned. The
        # CI key is throwaway (this is a debug-signed build either way), so the
        # passwords are the Gradle defaults and nothing secret is stored here.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype PKCS12 -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mruby-ime/mruby/build
          key: gradle-${{ runner.os }}-${{ hashFiles('mruby-ime/**/*.gradle.kts', 'mruby-ime/gradle/wrapper/gradle-wrapper.properties', 'mruby-ime/build_mruby.sh') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build mruby and the engine bytecode
        working-directory: mruby-ime
        run: |
          set -euo pipefail
          chmod +x build_mruby.sh gradlew
          ./build_mruby.sh

      - name: Verify the bytecode was regenerated
        working-directory: mruby-ime
        run: |
          set -euo pipefail
          test -f mruby/build/android-arm64-v8a/lib/libmruby.a
          for f in engine_irep.c keyboard_dsl_irep.c keyboard_layout_irep.c; do
            test -s "app/src/main/cpp/$f"
          done
          test -s app/src/main/assets/keyboard_layout.json
          ls -l mruby/build/android-arm64-v8a/lib/libmruby.a app/src/main/cpp/*_irep.c

      - name: Assemble release APK
        working-directory: mruby-ime
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease

      - name: Verify the APK is signed
        working-directory: mruby-ime
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          build_tools="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$apk"

      # Two names, on purpose:
      #   mrubyime-kivy.apk            fixed, so the Release always links
      #                               /releases/latest/download/mrubyime-kivy.apk
      #   mrubyime-kivy-<sha7>.apk     which commit it is, for the artifact
      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          src=mruby-ime/app/build/outputs/apk/release/app-release.apk
          sha="${GITHUB_SHA::7}"
          echo "BUILD_SHA=$sha" >> "$GITHUB_ENV"
          # Build timestamp, Asia/Taipei, so the file name alone orders builds
          # newest-last when the release assets are sorted alphabetically.
          stamp="$(TZ=Asia/Taipei date +%Y%m%d-%H%M%S)"
          # Filename varies per run, so the three assets (fixed name, stamped
          # name, sha) never collide on the rolling 'latest' release.
          stamped="mrubyime-kivy-${stamp}-${sha}.apk"
          install -D "$src" "dist/mrubyime-kivy.apk"
          cp "dist/mrubyime-kivy.apk" "dist/$stamped"
          printf '%s\n' "$sha" > dist/sha.txt
          {
            echo "BUILD_STAMP=$stamp"
            echo "STAMPED=$stamped"
          } >> "$GITHUB_ENV"
          echo "BUILD_STAMP=$stamp"
          echo "STAMPED=$stamped"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrubyime-kivy-apk
          path: dist/mrubyime-kivy-*.apk
          if-no-files-found: error
          retention-days: 30

      # A Release needs to write contents, and a fork's pull_request token is
      # read-only, so PRs stop here.
      - name: Drop the previous build from the rolling release
        # action-gh-release overwrites same-named assets but never deletes the
        # ones a previous run left behind, and the stamped asset name changes
        # on every build, so without this the release accumulates one APK pair
        # per push and 'latest' stops meaning anything.
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workflow-level `env` is not in the step environment here, so pass it.
          LATEST_TAG: ${{ env.LATEST_TAG }}
        run: |
          set -euo pipefail

          # Distinguish "no release yet" (first run on main: fine, nothing to
          # drop) from "the API call failed" (bad: old assets would survive and
          # accumulate). A bare `|| exit 0` swallows both.
          if ! err="$(gh release view "$LATEST_TAG" --json assets 2>&1 >/dev/null)"; then
            case "$err" in
              *"release not found"*|*"Not Found"*)
                echo "no '$LATEST_TAG' release yet; nothing to drop"
                exit 0
                ;;
            esac
            echo "::error::cannot inspect release '$LATEST_TAG': $err"
            exit 1
          fi

          # One name per line, no process substitution: `set -e` would not abort
          # on a failure inside <(...) and the old asset would silently survive.
          names="$(gh release view "$LATEST_TAG" --json assets -q '.assets[].name')"
          dropped=0
          failed=""
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in
              mrubyime-kivy.apk|mrubyime-kivy-*.apk) ;;
              *) continue ;;
            esac
            if gh release delete-asset "$LATEST_TAG" "$name" --yes; then
              echo "removed old asset: $name"
              dropped=$((dropped + 1))
            else
              failed="$failed $name"
            fi
          done <<< "$names"
          echo "dropped $dropped asset(s)"
          # Fail after the loop rather than inside it: collect every bad delete
          # and abort once, so the log names all of them instead of only the first.
          if [ -n "$failed" ]; then
            echo "::error::could not delete:$failed"
            exit 1
          fi

      - name: Publish to the rolling "latest" release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: "最新建置 ${{ env.BUILD_STAMP }}"
          body: |
            **建置時間：${{ env.BUILD_STAMP }}（Asia/Taipei，UTC+8）**

            - 提交：`${{ github.sha }}`（短碼 `${{ env.BUILD_SHA }}`）
            - 訊息：${{ github.event.head_commit.message }}
            - 來源：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            | 檔案 | 說明 |
            |---|---|
            | `mrubyime-kivy.apk` | 固定名稱，網址永遠不變 |
            | `${{ env.STAMPED }}` | 同一份 APK，檔名含建置時間 |

            固定下載網址（永遠是最新一次 main 建置）：

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/mrubyime-kivy.apk
            ```

            這是**以 debug key 簽章**的建置，可與手機上的舊版直接覆蓋安裝，但無法與正式的 debug keystore 版本互換。
          files: dist/*.apk
          make_latest: true
          fail_on_unmatched_files: true

      - name: Publish a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
