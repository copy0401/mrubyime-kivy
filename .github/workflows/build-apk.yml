name: Build APK

# Builds the arm64-v8a release APK on every push / PR that touches the project and
# uploads it as a downloadable artifact.  Pushing a `v*` tag additionally publishes
# a GitHub Release with the APK attached.
#
# What CI deliberately does NOT need:
#   - python-for-android / buildozer.  app/src/main/assets/private.tar is the
#     p4a-built Python bundle and it is committed; it already holds the compiled
#     .pyc for kivy_ime/**.  Regenerating it would need host CPython 3.14 (that is
#     the .pyc magic in the bundle) plus a full p4a recipe run, which no runner
#     image provides.  Python-only edits still go through ./sync_python.sh
#     locally, which rewrites private.tar before the change is committed.
#   - local.properties.  sdk.dir is written below from the runner's SDK path.
#
# What it does need, and provisions: ruby + rake (mruby is compiled from the
# vendored source tree), NDK 30.0.x (the app pins ndkVersion 30.0.16248370) and a
# debug keystore -- without one Gradle emits an *unsigned* release APK.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with mruby-ime/app/build.gradle.kts (ndkVersion, compileSdk)
  # and mruby-ime/gradle/wrapper/gradle-wrapper.properties.
  NDK_VERSION: "30.0.16248370"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: none

      - name: Install NDK
        # The runner ships an SDK, but sdkmanager sits outside PATH
        # (cmdline-tools/<ver>/bin), so resolve the binary by glob. Not
        # android-actions/setup-android: it runs `sdkmanager --install tools`,
        # and the `tools` package no longer exists in SDK repository 2, so v3
        # aborts with "Failed to find package 'tools'".
        run: |
          set -euo pipefail
          sdk="$ANDROID_SDK_ROOT"
          sdkmanager="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | head -1)"
          test -x "$sdkmanager"
          printf 'y\n%.0s' {1..50} | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;${NDK_VERSION}" "build-tools;34.0.0" "platforms;android-34"
          ndk="$sdk/ndk/${NDK_VERSION}"
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

      - name: Point Gradle at the runner SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mruby-ime/local.properties

      - name: Install a debug keystore
        # app/build.gradle.kts only attaches the release signing config when
        # ~/.android/debug.keystore exists; otherwise the APK is unsigned. The
        # CI key is throwaway (this is a debug-signed build either way), so the
        # passwords are the Gradle defaults and nothing secret is stored here.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype PKCS12 -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mruby-ime/mruby/build
          key: gradle-${{ runner.os }}-${{ hashFiles('mruby-ime/**/*.gradle.kts', 'mruby-ime/gradle/wrapper/gradle-wrapper.properties', 'mruby-ime/build_mruby.sh') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build mruby and the engine bytecode
        working-directory: mruby-ime
        run: |
          set -euo pipefail
          chmod +x build_mruby.sh gradlew
          ./build_mruby.sh

      - name: Verify the bytecode was regenerated
        working-directory: mruby-ime
        run: |
          set -euo pipefail
          test -f mruby/build/android-arm64-v8a/lib/libmruby.a
          for f in engine_irep.c keyboard_dsl_irep.c keyboard_layout_irep.c; do
            test -s "app/src/main/cpp/$f"
          done
          test -s app/src/main/assets/keyboard_layout.json
          ls -l mruby/build/android-arm64-v8a/lib/libmruby.a app/src/main/cpp/*_irep.c

      - name: Assemble release APK
        working-directory: mruby-ime
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease

      - name: Verify the APK is signed
        working-directory: mruby-ime
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          build_tools="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$apk"

      - name: Rename artifact
        run: |
          set -euo pipefail
          src=mruby-ime/app/build/outputs/apk/release/app-release.apk
          dst="app-release-${GITHUB_SHA::7}.apk"
          install -D "$src" "dist/$dst"
          ls -l "dist/$dst"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrubyime-kivy-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
